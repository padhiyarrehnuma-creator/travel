<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel · Explore World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

    <!-- ADMIN LOGIN -->
    <div id="adminLogin" class="admin-login">
        <div class="admin-login-box">
            <div class="admin-logo">
                <h1>⚙️ <span>Admin</span> Panel</h1>
                <p>Explore World · Management</p>
            </div>
            <form id="adminLoginForm" autocomplete="off">
                <input type="email" id="adminEmail" placeholder="Admin Email" required />
                <div class="password-field">
                    <input type="password" id="adminPassword" placeholder="Password" required />
                    <button type="button" class="toggle-password" data-target="adminPassword">👁️</button>
                </div>
                <button type="submit" class="admin-login-btn">🔐 Login as Admin</button>
            </form>
         
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="admin-dashboard" style="display: none;">
        <!-- ADMIN HEADER -->
        <header class="admin-header">
            <div class="admin-header-left">
                <h1>⚙️ Admin Dashboard</h1>
                <span class="admin-badge">LIVE</span>
            </div>
            <div class="admin-header-right">
                <button class="admin-refresh-btn" onclick="refreshAdminData()">🔄 Refresh</button>
                <button class="admin-export-btn" onclick="exportCSV()">📥 Export CSV</button>
                <button class="admin-logout-btn" onclick="adminLogout()">🚪 Logout</button>
            </div>
        </header>

        <!-- STATS CARDS -->
        <div class="admin-stats-grid">
            <div class="admin-stat-card">
                <div class="admin-stat-icon">📦</div>
                <div class="admin-stat-number" id="adminTotalBookings">0</div>
                <div class="admin-stat-label">Total Bookings</div>
            </div>
            <div class="admin-stat-card">
                <div class="admin-stat-icon">💰</div>
                <div class="admin-stat-number" id="adminTotalRevenue">₹0</div>
                <div class="admin-stat-label">Total Revenue</div>
            </div>
            <div class="admin-stat-card pending">
                <div class="admin-stat-icon">⏳</div>
                <div class="admin-stat-number" id="adminPendingPayments">₹0</div>
                <div class="admin-stat-label">Pending Payments</div>
            </div>
            <div class="admin-stat-card success">
                <div class="admin-stat-icon">✅</div>
                <div class="admin-stat-number" id="adminCompletedPayments">₹0</div>
                <div class="admin-stat-label">Completed Payments</div>
            </div>
        </div>

        <!-- SECONDARY STATS -->
        <div class="admin-stats-grid-small">
            <div class="admin-stat-small">
                <span>👥</span>
                <div>
                    <strong id="adminTotalUsers">0</strong>
                    <small>Users</small>
                </div>
            </div>
            <div class="admin-stat-small">
                <span>✈️</span>
                <div>
                    <strong id="adminTotalFlights">0</strong>
                    <small>Flight Bookings</small>
                </div>
            </div>
            <div class="admin-stat-small">
                <span>🏨</span>
                <div>
                    <strong id="adminTotalHotels">0</strong>
                    <small>Hotel Bookings</small>
                </div>
            </div>
            <div class="admin-stat-small">
                <span>🎒</span>
                <div>
                    <strong id="adminTotalTours">0</strong>
                    <small>Tour Bookings</small>
                </div>
            </div>
        </div>

        <!-- TABS -->
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="all">📋 All Bookings</button>
            <button class="admin-tab" data-tab="tours">🎒 Tours</button>
            <button class="admin-tab" data-tab="flights">✈️ Flights</button>
            <button class="admin-tab" data-tab="hotels">🏨 Hotels</button>
            <button class="admin-tab" data-tab="payments">💳 Payments</button>
        </div>

        <!-- SEARCH -->
        <div class="admin-search-bar">
            <input type="text" id="adminSearchInput" placeholder="🔍 Search by booking ID, tour name, or user..." oninput="filterAdminData()" />
        </div>

        <!-- TABLES -->
        <div class="admin-table-container">
            <table class="admin-table" id="adminTable">
                <thead>
                    <tr id="adminTableHead">
                        <!-- Filled by JS -->
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <!-- Filled by JS -->
                </tbody>
            </table>
            <div id="adminEmptyState" class="admin-empty" style="display: none;">
                No data available.
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
